name: Daily News Digest

on:
  schedule:
    # Täglich um 05:25 UTC (ca. 07:25 MESZ bzw. 06:25 MEZ)
    # Wichtig: '25' statt '30'/'00' verhindert, dass GitHub den Run wegen Serverüberlastung verwirft!
    - cron: '25 5 * * *'
  workflow_dispatch: # Ermöglicht manuelles Auslösen mit einem Klick auf GitHub!

# Verhindert parallele Läufe mit update_rss.yaml und damit Merge-Konflikte in static/rss/
concurrency:
  group: news-bot-main-sync
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Quellcode auschecken
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-bot.txt
          pip install --upgrade --no-cache-dir "bot-dashboard @ git+https://github.com/hschenke/bot-dashboard.git@main"

      - name: 🚀 News Bot ausführen
        env:
          PYTHONUNBUFFERED: "1"
          AI_BRAIN_KEY: ${{ secrets.AI_BRAIN_KEY }}
          EMAIL_PROVIDER: ${{ secrets.EMAIL_PROVIDER || 'resend' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || 'News Bot <onboarding@resend.dev>' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_KEY: ${{ secrets.TURSO_KEY }}
          TURSO_TIMEOUT: "30.0"
        run: |
          python src/main.py

      - name: 🚀 Aktualisierte RSS-Feeds & Konfiguration zu GitHub pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/rss/ config/sources.yaml config/settings.yaml config/prompts.yaml
          if git diff --staged --quiet; then
            echo "Keine Änderungen in den RSS-Feeds oder Konfigurationsdateien vorhanden."
          else
            COMMIT_MSG="chore(rss): update static RSS feeds [skip ci]"
            git commit -m "$COMMIT_MSG"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              LOCAL_SHA=$(git rev-parse HEAD)
              if ! git rebase -X theirs origin/main; then
                echo "Rebase-Konflikt erkannt (Versuch $attempt) – übernehme frisch generierte RSS-/Konfig-Dateien auf origin/main..."
                git rebase --abort || true
                git reset --hard origin/main
                git checkout "$LOCAL_SHA" -- static/rss/ config/sources.yaml config/settings.yaml config/prompts.yaml
                git add static/rss/ config/sources.yaml config/settings.yaml config/prompts.yaml
                if git diff --staged --quiet; then
                  pushed=1
                  break
                fi
                git commit -m "$COMMIT_MSG"
              fi
              if git push origin main; then
                pushed=1
                break
              fi
              echo "Push fehlgeschlagen (Versuch $attempt), wiederhole mit aktuellem origin/main..."
              sleep 2
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Push zu origin/main nach 3 Versuchen fehlgeschlagen."
              exit 1
            fi
          fi

      - name: ⚡ jsDelivr CDN-Cache leeren
        if: success()
        run: |
          python -c "from src.aggregator import purge_jsdelivr_cache; purge_jsdelivr_cache()"

      - name: 📦 HTML-Vorschau als Artefakt archivieren
        # Archiviert das generierte HTML-Briefing als herunterladbares Workflow-Artefakt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-digest-preview
          path: output/
          if-no-files-found: ignore
