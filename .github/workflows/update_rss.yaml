name: Update RSS Feeds to CDN

on:
  push:
    branches:
      - main
    paths:
      - 'config/sources.yaml'
      - 'config/settings.yaml'
      - 'config/prompts.yaml'
  workflow_dispatch:
  repository_dispatch:
    types: [update-rss-feeds]

# Verhindert parallele Läufe mit daily_digest.yaml und damit Merge-Konflikte in static/rss/
concurrency:
  group: news-bot-main-sync
  cancel-in-progress: false

jobs:
  update-rss:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Quellcode auschecken
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pyyaml requests python-dotenv

      - name: 📡 RSS-Feeds neu generieren
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_KEY: ${{ secrets.TURSO_KEY }}
          TURSO_TIMEOUT: "30.0"
        run: |
          python -c "from src.aggregator import sync_configs_from_storage, collect_all_news; sync_configs_from_storage(force=True); collect_all_news()"

      - name: 🚀 Aktualisierte RSS-Feeds zu GitHub / CDN pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/rss/ config/sources.yaml config/settings.yaml config/prompts.yaml
          if git diff --staged --quiet; then
            echo "Keine Änderungen in den RSS-Feeds vorhanden."
          else
            COMMIT_MSG="chore(rss): rebuild and update RSS feeds for CDN [skip ci]"
            git commit -m "$COMMIT_MSG"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin main
              LOCAL_SHA=$(git rev-parse HEAD)
              if ! git rebase -X theirs origin/main; then
                echo "Rebase-Konflikt erkannt (Versuch $attempt) – übernehme frisch generierte RSS-/Konfig-Dateien auf origin/main..."
                git rebase --abort || true
                git reset --hard origin/main
                git checkout "$LOCAL_SHA" -- static/rss/ config/sources.yaml config/settings.yaml config/prompts.yaml
                git add static/rss/ config/sources.yaml config/settings.yaml config/prompts.yaml
                if git diff --staged --quiet; then
                  pushed=1
                  break
                fi
                git commit -m "$COMMIT_MSG"
              fi
              if git push origin main; then
                pushed=1
                break
              fi
              echo "Push fehlgeschlagen (Versuch $attempt), wiederhole mit aktuellem origin/main..."
              sleep 2
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Push zu origin/main nach 3 Versuchen fehlgeschlagen."
              exit 1
            fi
            echo "RSS-Feeds erfolgreich zu GitHub und CDN gepusht!"
          fi

      - name: ☁️ Cloud-DB Git-Sync-Status bestätigen
        if: success()
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_KEY: ${{ secrets.TURSO_KEY }}
          TURSO_TIMEOUT: "30.0"
        run: |
          python -c "from src.sources_manager import mark_canonical_configs_synced_to_git; print('Cloud-DB Git-Sync CAS:', mark_canonical_configs_synced_to_git())"

      - name: ⚡ jsDelivr CDN-Cache leeren
        if: success()
        run: |
          python -c "from src.aggregator import purge_jsdelivr_cache; purge_jsdelivr_cache()"
