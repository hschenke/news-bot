name: Update RSS Feeds to CDN

on:
  push:
    branches:
      - main
    paths:
      - 'config/sources.yaml'
      - 'config/settings.yaml'
      - 'config/prompts.yaml'
  workflow_dispatch:
  repository_dispatch:
    types: [update-rss-feeds]

jobs:
  update-rss:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: 📥 Quellcode auschecken
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pyyaml requests python-dotenv

      - name: 📡 RSS-Feeds neu generieren
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_KEY: ${{ secrets.TURSO_KEY }}
          TURSO_TIMEOUT: "30.0"
        run: |
          python -c "from src.aggregator import sync_configs_from_storage, collect_all_news; sync_configs_from_storage(force=True); collect_all_news()"

      - name: 🚀 Aktualisierte RSS-Feeds zu GitHub / CDN pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/rss/ config/sources.yaml config/settings.yaml config/prompts.yaml
          if git diff --staged --quiet; then
            echo "Keine Änderungen in den RSS-Feeds vorhanden."
          else
            git commit -m "chore(rss): rebuild and update RSS feeds for CDN [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "RSS-Feeds erfolgreich zu GitHub und CDN gepusht!"
          fi

      - name: ⚡ jsDelivr CDN-Cache leeren
        if: success()
        run: |
          python -c "from src.aggregator import purge_jsdelivr_cache; purge_jsdelivr_cache()"
